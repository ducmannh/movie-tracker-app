server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip nén dữ liệu giúp tải trang siêu tốc
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Hỗ trợ Single Page Application (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache tài nguyên tĩnh (assets, fonts, images) trong 1 năm
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Không cache index.html để đảm bảo người dùng luôn nhận bản mới nhất khi deploy
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
